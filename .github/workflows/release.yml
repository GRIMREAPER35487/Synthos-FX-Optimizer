name: Release Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version and Package Name
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Release under the tag exactly as pushed (so "1.0.3" doesn't become "v1.0.3")
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="$GITHUB_REF_NAME"
          else
            # Manual run from a branch: take the version from package.json
            VERSION=$(jq -r .version package.json)
            TAG_NAME="v${VERSION}"
          fi
          PKG_NAME=$(jq -r .name package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=${PKG_NAME}-${VERSION}.zip" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create release zip
        run: |
          mkdir -p build
          zip -r "build/${{ steps.version.outputs.ZIP_NAME }}" . -x ".git/*" ".github/*" "build/*" ".gitignore" "*.old" "*.old.meta"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ steps.version.outputs.ZIP_NAME }}
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

      - name: Trigger VPM Listing Rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.VPM_REPO_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "Triggering Synthos-VRC-Packages build listing..."
            gh workflow run build-listing.yml --repo GRIMREAPER35487/Synthos-VRC-Packages || \
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/GRIMREAPER35487/Synthos-VRC-Packages/dispatches \
              -d '{"event_type":"package-released"}' || true
          else
            echo "VPM_REPO_TOKEN secret not configured; skipping trigger."
          fi
